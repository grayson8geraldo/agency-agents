[project]
name = "crypto-mtfa-bot"
version = "0.1.0"
description = "Multi-Timeframe Analysis crypto trading bot using ICT/SMC concepts"
requires-python = ">=3.11"

dependencies = [
    "ccxt>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
crypto-bot = "crypto_bot.main:main"
